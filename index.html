
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alianza Global Solidaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animación de latido para el botón de donar */
        @keyframes heartbeat {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(248, 192, 0, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(248, 192, 0, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(248, 192, 0, 0);
            }
        }

        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        /* Detener la animación al pasar el mouse para que no interfiera con el hover */
        .animate-heartbeat:hover {
            animation: none;
        }
    </style>
